http
{
	server
	{
		listen 127.0.0.1:8080;
		listen 127.0.0.1:8081;
		server_name localhost;
		client_body_size 100000000;
		root /data/www;
		index index.html;
		autoindex on;
		location /cgi-bin
		{
			root ./;
			method GET;
			autoindex on;
		}
		location /subdir1/subdir2/
		{
			autoindex off;
		}
		location /subdir1b/
		{
			index home.html;
		}
	}
	server
	{
		listen 127.0.0.1:8082;
		listen 127.0.0.1:8083;
		server_name test_config1;
		client_body_size 100 000 000;
		root /data/www;
		index index.html;
		method GET;
	}
	server
	{
		listen 127.0.0.1:8084;
		listen 127.0.0.1:8085;
		server_name test_config2;
		client_body_size 10;
		root /data/www;
		index index.html;
		method;
	}
}
