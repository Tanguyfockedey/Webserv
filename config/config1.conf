http
{
	server
	{
		listen127.0.0.1:8080;
		listen 8081;
		server_namelocalhost;
		client_body_size 100 000 000;
		index index.html;
		root /data/www;
		location/
		{
			root /data/www;
		}
		location /images/download
		{
			root /data/downloads;
			method POST, DELETE;
			autoindex on;
		}
		location /images
		{
			root /data/images;
			method GET;
			autoindex on;
		}
	}
	server
	{
		listen 0.0.0.0:8800;
		listen      0.0.0.0:8802	;
		server_name example      ;
		location /images
		{
			root /data/images/example;
			method GET;
			autoindex on;
		}
		location /images  /down     load
		{
			root /data/downloads/example;
			method POST,    DELETE;
			autoindex 	on     ;
		}
	}
	server
	{
		listen 0.0.0.0:8803;
		server_name test;
		location /download
		{
			root /data/www/test;
			method POST, PUT, DELETE;
			autoindex on;
		}
	}
}
