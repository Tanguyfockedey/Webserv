http
{
	server
	{
		listen    127.0.0.1:8080  ;
		listen 8081;
		  server_name   localhost    ;
		client_body_size 100 000 000;
		index index.html;
		root /data/www    ;
		  location   /  
		{
			root /data/www;
		}
		location /images/download
		{
			root /data/downloads;
			method POST, DELETE;
			autoindex on;
		}
		location /  images
		{
			root /data/images;
			method GET;
			autoindex on;
		}
		test;
	}
	server
	{
		listen 0.0.0.0:8800;
		listen 0.0.0.0:8802;
		server_name example;
		location /
		{
			root /data/www/example;
			method GET;
		}
	}
	server
	{
		listen 0.0.0.0:8803;
		server_name test;
		location /download
		{
			root /data/www/test;
			method POST, PUT, DELETE;
			autoindex on;
		}
	}
}
