http
{
	server
	{
		listen 127.0.0.1:8800;
		listen 8801;
		server_name YoupiBanane;
		client_body_size 100 000 000;
		index index.html;
		root docs/fusion_web/;
		location /
		{
			method GET;
		}
		location /put_test/
		{
			method PUT;
			root /data/www/YoupiBanane/put_test;
		}
		location /post_body/
		{
			metod POST;
			max_body_size 100;
		}
		location /directory/
		{
			method GET;
			root /YoupiBanane;
			index youpi.bad_extension;
		}
	}
}