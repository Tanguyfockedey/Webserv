<!DOCTYPE html>
<html lang="en">
    <head>
		<link rel="shortcut icon" type="image/x-icon" href="/favicon.ico">
		<link rel="stylesheet" type="text/css" href="/styles.css">
        <title>Some page</title>
	</head>
	<body style="background-color: #D0FFA0">
		<h1>
				<strong>Zen page</strong>
		</h1>
		<p>
			This is just an example of a basic web page.
		</p>
		<p>
			<img src="assets/images/forest.jpg" alt="A beautiful forest">
			<br>
			<quote style="font-style: italic; font-size: large; color: #223;">"The clearest way into the Universe is through a forest wilderness."</quote>
		</p>
		<audio id="audio_naturesounds" controls>
			<source src="assets/sounds/nature_ambiance.mp3" type="audio/mpeg">
			Your browser does not support the audio element.
		</audio>
		<script>
			document.addEventListener("DOMContentLoaded", () => {
				var audio = document.getElementById("audio_naturesounds");
				audio.volume = 0.3;
				audio.play();
			});
		</script>
		<p style="margin-top: 90px;">
			<a href="/">Go back to the index page</a>
		</p>
	</body>
</html>
